services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: rebloom-postgres
    restart: unless-stopped
    # ports: 대신 expose를 사용하여 내부망에서만 5432 포트 허용
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rebloom}
      POSTGRES_USER: ${POSTGRES_USER:-rebloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro  # 초기 DB 생성 SQL 마운트
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rebloom-network

  redis:
    image: redis:7-alpine
    container_name: rebloom-redis
    restart: unless-stopped
    # 외부 접속이 필요 없는 Redis도 내부망 전용으로 설정
    expose:
      - "6379"
    environment:
      TZ: ${TZ:-Asia/Seoul}
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rebloom-network

networks:
  rebloom-network:
    name: rebloom-network
    driver: bridge

volumes:
  postgres-data:
  redis-data: