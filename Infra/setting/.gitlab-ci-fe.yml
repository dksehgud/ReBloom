# Build FE/web
build-web:
  image: node:22-alpine
  stage: build
  tags:
    - rebloom-dev
  services: [ ]
  script:
    - echo "----- FE web build start -----"
    - cd FE/web
    - npm ci
    - npm run build
  artifacts:
    paths:
      - FE/web/dist/
    expire_in: 1 hour
  rules:
    - changes:
        - "FE/web/**/*"

build-mobile-apk:
  image: ghcr.io/cirruslabs/android-sdk:36
  stage: build
  tags:
    - rebloom-dev
  services: [ ]
  script:
    - echo "----- FE mobile debug APK build start -----"
    - cd FE/mobile-app
    - cp $FCM_CLIENT_JSON ./app/google-services.json
    - chmod +x ./gradlew
    - ./gradlew :app:assembleDebug --no-daemon -PWEB_APP_BASE_URL="${MOBILE_WEB_APP_BASE_URL}" -PAPI_BASE_URL="${MOBILE_API_BASE_URL}" -PDIARY_ANALYSIS_API_URL="${MOBILE_DIARY_ANALYSIS_API_URL}"
  artifacts:
    paths:
      - FE/mobile-app/app/build/outputs/apk/debug/*.apk
    expire_in: 7 days
  rules:
    - changes:
        - "FE/mobile-app/**/*"

upload-mobile-apk-to-drive:
  image:
    name: rclone/rclone:latest
    entrypoint: [""]
  stage: web-deploy
  tags:
    - rebloom-dev
  services: [ ]
  needs:
    - job: build-mobile-apk
      artifacts: true
  script:
    - echo "----- FE mobile APK Google Drive upload start -----"
    - |
      APK_PATH="$(find FE/mobile-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
      if [ -z "$APK_PATH" ]; then
        echo "APK not found"
        exit 1
      fi
      DRIVE_NAME="rebloom-debug-${CI_COMMIT_SHORT_SHA}.apk"
      cp "$APK_PATH" "$DRIVE_NAME"
      export RCLONE_CONFIG_GDRIVE_TYPE="drive"
      export RCLONE_CONFIG_GDRIVE_SCOPE="drive"
      export RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE="$GDRIVE_SERVICE_ACCOUNT_JSON"
      export RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID="$GDRIVE_APK_FOLDER_ID"
      rclone copy "$DRIVE_NAME" gdrive: --drive-stop-on-upload-limit
  rules:
    - changes:
        - "FE/mobile-app/**/*"

# deploy-web에서는 build-web에서 생성된 dist 폴더를 S3에 업로드하고 CloudFront 무효화 요청을 보냅니다.
deploy-web:
  image: node:22-alpine
  stage: web-deploy
  tags:
    - rebloom-dev
  services: [ ]
  needs:
    - job: build-web
      artifacts: true
  before_script:
    - apk add --no-cache aws-cli
  script:
    - echo "----- FE web deploy start -----"
    - aws s3 sync FE/web/dist "s3://${DEPLOY_S3_BUCKET}" --delete --exclude "models/*"
    - aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
  rules:
    - changes:
        - "FE/web/**/*"


