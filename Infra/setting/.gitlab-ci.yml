image: docker:24.0.5

include:
  - local: "Infra/setting/.gitlab-ci-fe.yml"

services:
  - docker:24.0.5-dind

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_API_VERSION: "1.43"

  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_NAMESPACE: $DOCKER_USERNAME

  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - build
  - build-and-push  # build와 docker-push를 하나로 통합
  - web-deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "BE/**/*"
        - "AI/bio-ml-service/**/*"
        - "FE/web/**/*"
        - "FE/mobile-app/**/*"
    - when: never

cache:
  key: gradle-cache
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

# ====================================================
# 공통 템플릿 (Build & Push 통합)
# ====================================================

.build-and-push-template:
  image: eclipse-temurin:21-jdk-alpine
  stage: build-and-push
  tags:
    - rebloom-dev
  before_script:
    - apk add --no-cache docker-cli
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - |
      if [ "$SERVICE_NAME" == "notification-service" ]; then
        echo "----- Creating FCM Server Key for notification-service -----"
        mkdir -p BE/services/notification-service/src/main/resources/firebase
        cp $FCM_SERVER_JSON BE/services/notification-service/src/main/resources/firebase/firebase-service-account.json
      fi
  script:
    - echo "----- ${SERVICE_NAME} 빌드 시작 -----"
    - cd BE
    - chmod +x ./gradlew
    
    # 1. Spring Boot 빌드 수행 (jar 파일 생성)
    - ./gradlew :services:${SERVICE_NAME}:bootJar -x test
    - rm -f services/${SERVICE_NAME}/build/libs/*-plain.jar
    
    # 2. 빌드 결과 확인
    - ls -lh services/${SERVICE_NAME}/build/libs/
    
    - echo "----- ${SERVICE_NAME} Docker 이미지 빌드 및 Push 시작 -----"
    
    # 3. Docker 이미지 빌드 및 Push (Artifacts 업로드 없이 로컬 파일 바로 사용)
    - docker build -t $DOCKER_NAMESPACE/${IMAGE_NAME}:$IMAGE_TAG -t $DOCKER_NAMESPACE/${IMAGE_NAME}:latest -f services/${SERVICE_NAME}/Dockerfile .
    - docker push $DOCKER_NAMESPACE/${IMAGE_NAME}:$IMAGE_TAG
    - docker push $DOCKER_NAMESPACE/${IMAGE_NAME}:latest

# ====================================================
# [STAGE 1] Spring Boot 개별 서비스 빌드 및 Push
# ====================================================

build-push-auth-service:
  extends: .build-and-push-template
  variables:
    SERVICE_NAME: auth-service
    IMAGE_NAME: rebloom-auth
  rules:
    - changes:
        - "BE/services/auth-service/**/*"
        - "BE/modules/common-module/**/*"
        - "BE/modules/security-module/**/*"
        - "BE/build.gradle"
        - "BE/common-service.gradle"
        - "BE/settings.gradle"
        - "BE/gradlew"
        - "BE/gradlew.bat"
        - "BE/gradle/**/*"

