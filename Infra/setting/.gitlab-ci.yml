# Notification Service
push-notification-service:
  stage: docker-push
  tags:
    - rebloom-dev
  needs: [backend-build]
  rules:
    - changes:
        - "BE/services/notification-service/**/*"
        - "BE/modules/**/*"
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - cd BE
    # 2개(커밋해시, latest)를 동시에 붙임
    - docker build -t $DOCKER_NAMESPACE/rebloom-auth-service:$IMAGE_TAG -t $DOCKER_NAMESPACE/rebloom-auth-service:latest -f services/auth-service/Dockerfile .
    
    # 푸시도 두 번(이미지는 1개)
    - docker push $DOCKER_NAMESPACE/rebloom-auth-service:$IMAGE_TAG
    - docker push $DOCKER_NAMESPACE/rebloom-auth-service:latest

