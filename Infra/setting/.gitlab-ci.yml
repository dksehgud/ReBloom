# Docker-in-Docker(DinD)로 세팅
image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_NAMESPACE: $DOCKER_USERNAME

stages:
  - build
  - docker-push

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "BE/**/*"

# ----------------------------------------------------
# Spring Boot 전체 빌드 (Java 21 환경)
# ----------------------------------------------------
backend-build:
  image: eclipse-temurin:21-jdk-alpine
  stage: build
  tags:
    - rebloom-dev
  script:
    - echo "----- 무균실(Docker) 내부에서 Gradle 빌드 시작 -----"
    - cd BE
    - chmod +x ./gradlew
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - BE/services/*/build/libs/*.jar
    expire_in: 1 hour

# ----------------------------------------------------
# Docker 이미지 빌드 및 Push (각 서비스별 분리)
# ----------------------------------------------------

# Auth Service
push-auth-service:
  stage: docker-push
  tags:
    - rebloom-dev
  needs: [backend-build]
  rules:
    - changes:
        - "BE/services/auth-service/**/*"
        - "BE/modules/**/*"
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - cd BE
    - docker build -t $DOCKER_NAMESPACE/rebloom-auth:$IMAGE_TAG -t $DOCKER_NAMESPACE/rebloom-auth:latest -f services/auth-service/Dockerfile .
    - docker push $DOCKER_NAMESPACE/rebloom-auth:$IMAGE_TAG
    - docker push $DOCKER_NAMESPACE/rebloom-auth:latest

