image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_NAMESPACE: $DOCKER_USERNAME

  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - build
  - docker-push

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "BE/**/*"
    - when: never

cache:
  key: gradle-cache
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

# ====================================================
# 공통 템플릿
# ====================================================

.build-template:
  image: eclipse-temurin:21-jdk-alpine
  stage: build
  tags:
    - rebloom-dev
  script:
    - echo "----- ${SERVICE_NAME} 빌드 검증 시작 -----"
    - cd BE
    - chmod +x ./gradlew
    - ./gradlew :services:${SERVICE_NAME}:build -x test
  # artifact 업로드 제거
  # 이유: build/libs/*.jar 업로드 시 bootJar + plain.jar가 같이 올라가며 413 발생 가능

.push-template:
  image: eclipse-temurin:21-jdk-alpine
  stage: docker-push
  tags:
    - rebloom-dev
  before_script:
    - apk add --no-cache docker-cli
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - echo "----- ${SERVICE_NAME} Docker 이미지 빌드 및 Push 시작 -----"
    - cd BE
    - chmod +x ./gradlew

    # Docker build에 필요한 실행 jar만 생성
    - ./gradlew :services:${SERVICE_NAME}:bootJar -x test

    # plain jar 제거
    - rm -f services/${SERVICE_NAME}/build/libs/*-plain.jar

    # bootJar가 정확히 존재하는지 확인
    - ls -lh services/${SERVICE_NAME}/build/libs/

    # Docker 이미지 빌드 및 Push
    - docker build
      -t $DOCKER_NAMESPACE/${IMAGE_NAME}:$IMAGE_TAG
      -t $DOCKER_NAMESPACE/${IMAGE_NAME}:latest
      -f services/${SERVICE_NAME}/Dockerfile
      .
    - docker push $DOCKER_NAMESPACE/${IMAGE_NAME}:$IMAGE_TAG
    - docker push $DOCKER_NAMESPACE/${IMAGE_NAME}:latest

# ====================================================
# [STAGE 1] Spring Boot 개별 빌드 검증
# ====================================================

build-auth-service:
  extends: .build-template
  variables:
    SERVICE_NAME: auth-service
  rules:
    - changes:
        - "BE/services/auth-service/**/*"
        - "BE/modules/**/*"
        - "BE/*"

