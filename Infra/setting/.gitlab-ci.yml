# Docker-in-Docker(DinD)로 세팅
image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_NAMESPACE: $DOCKER_USERNAME

stages:
  - build
  - docker-push

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "BE/**/*"

# ====================================================
# [STAGE 1] Spring Boot 개별 빌드 (Java 21 환경)
# ====================================================

build-auth-service:
  image: eclipse-temurin:21-jdk-alpine
  stage: build
  tags:
    - rebloom-dev
  script:
    - echo "----- Auth Service 빌드 시작 -----"
    - cd BE
    - chmod +x ./gradlew
    - ./gradlew :services:auth-service:build -x test
  artifacts:
    paths:
      - BE/services/auth-service/build/libs/*.jar
    expire_in: 1 hour

