image: docker:24.0.5

include:
  - local: "Infra/setting/.gitlab-ci-fe.yml"

services:
  - docker:24.0.5-dind

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_API_VERSION: "1.43"

  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_NAMESPACE: $DOCKER_USERNAME

  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - build
  - docker-push
  - web-deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "BE/**/*"
        - "FE/web/**/*"
        - "FE/mobile-app/**/*"
    - when: never

cache:
  key: gradle-cache
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

# ====================================================
# 공통 템플릿
# ====================================================

.build-template:
  image: eclipse-temurin:21-jdk-alpine
  stage: build
  tags:
    - rebloom-dev
  script:
    - echo "----- ${SERVICE_NAME} 빌드 검증 시작 -----"
    - cd BE
    - chmod +x ./gradlew
    # 빌드 검증과 동시에 최종 bootJar 생성
    - ./gradlew :services:${SERVICE_NAME}:bootJar -x test
    # plain.jar는 용량만 차지하므로 빌드 직후 제거
    - rm -f services/${SERVICE_NAME}/build/libs/*-plain.jar
  artifacts:
    paths:
      - BE/services/${SERVICE_NAME}/build/libs/*.jar
    expire_in: 30 mins

.push-template:
  image: eclipse-temurin:21-jdk-alpine
  stage: docker-push
  tags:
    - rebloom-dev
  before_script:
    - apk add --no-cache docker-cli
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - |
      if [ "$SERVICE_NAME" == "notification-service" ]; then
        echo "----- Creating FCM Server Key for notification-service -----"
        # application.yml의 경로 구조에 맞춰 디렉토리 생성
        mkdir -p BE/services/notification-service/src/main/resources/firebase
        # 파일명을 firebase-service-account.json으로 일치시켜 복사
        cp $FCM_SERVER_JSON BE/services/notification-service/src/main/resources/firebase/firebase-service-account.json
      fi

  script:
    - echo "----- ${SERVICE_NAME} Docker 이미지 빌드 및 Push 시작 -----"
    - cd BE
    
    # build stage의 artifact에서 넘어온 bootJar가 정확히 존재하는지 확인
    - ls -lh services/${SERVICE_NAME}/build/libs/

    # Docker 이미지 빌드 및 Push (새로 빌드하지 않고 artifacts로 받은 jar 바로 사용)
    - docker build -t $DOCKER_NAMESPACE/${IMAGE_NAME}:$IMAGE_TAG -t $DOCKER_NAMESPACE/${IMAGE_NAME}:latest -f services/${SERVICE_NAME}/Dockerfile .
    - docker push $DOCKER_NAMESPACE/${IMAGE_NAME}:$IMAGE_TAG
    - docker push $DOCKER_NAMESPACE/${IMAGE_NAME}:latest

# ====================================================
# [STAGE 1] Spring Boot 개별 빌드 검증
# ====================================================

build-auth-service:
  extends: .build-template
  variables:
    SERVICE_NAME: auth-service
  rules:
    - changes:
        - "BE/services/auth-service/**/*"
        - "BE/modules/common-module/**/*"
        - "BE/modules/security-module/**/*"
        - "BE/build.gradle"
        - "BE/common-service.gradle"
        - "BE/settings.gradle"
        - "BE/gradlew"
        - "BE/gradlew.bat"
        - "BE/gradle/**/*"

