services:
  kafka-1:
    image: apache/kafka:3.7.0
    container_name: kafka-1
    # 내부망 통신을 위해 9092 포트 노출
    expose:
      - "9092"
    environment:
      # Apache 표준 환경 변수 적용
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # 클러스터 ID (배포 환경에서는 고정값 권장 또는 외부 주입)
      - CLUSTER_ID=${KAFKA_CLUSTER_ID:-local-cluster-id-1234}
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    networks:
      - rebloom-network
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:3.7.0
    container_name: kafka-2
    expose:
      - "9092"
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - CLUSTER_ID=${KAFKA_CLUSTER_ID:-local-cluster-id-1234}
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    networks:
      - rebloom-network
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:3.7.0
    container_name: kafka-3
    expose:
      - "9092"
    environment:
      - KAFKA_NODE_ID=3
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - CLUSTER_ID=${KAFKA_CLUSTER_ID:-local-cluster-id-1234}
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    networks:
      - rebloom-network
    restart: unless-stopped

  kafka-init-topics:
    image: apache/kafka:3.7.0
    container_name: kafka-init-topics
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - rebloom-network
    restart: "no"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "Waiting for Kafka brokers..."
        # Apache 이미지 내 도구 경로 수정
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --list >/dev/null 2>&1; do
          sleep 2
        done
        echo "Creating Rebloom Kafka topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic rebloom.biometric.raw.v1 --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic rebloom.sleep.raw.v1 --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic rebloom.biometric.analysis.v1 --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic rebloom.anomaly.verified.v1 --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic rebloom.conversation.initiate.v1 --partitions 1 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic rebloom.analysis.report-completed.v1 --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic rebloom.ai.model.train.requested.v1 --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic rebloom.phq.result.v1 --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic rebloom.event.dlt.v1 --partitions 1 --replication-factor 3
        echo "Kafka topics created successfully."

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:

networks:
  rebloom-network:
    external: true