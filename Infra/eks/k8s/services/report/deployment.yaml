apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: rebloom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
        - name: report-service
          image: cramfull99/rebloom-report:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: report-config
            - secretRef:
                name: report-secret
