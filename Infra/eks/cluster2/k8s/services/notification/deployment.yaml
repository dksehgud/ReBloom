apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: rebloom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: cramfull99/rebloom-notification:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secret
