apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: rebloom
data:
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "prod"
  AUTH_SERVICE_URI: "http://auth-service:8081"
  INTAKE_SERVICE_URI: "http://intake-service:8082"
  BIOMETRIC_SERVICE_URI: "http://biometric-service:8083"
  REPORT_SERVICE_URI: "http://report-service:8084"
  NOTIFICATION_SERVICE_URI: "http://notification-service:8085"
  BIO_ML_SERVICE_URI: "http://bio-ml-service:8002"
  FRONTEND_URL: "https://rebloom.cloud"
  FRONTEND_REDIRECT_URL: "https://rebloom.cloud"
  FRONTEND_WEBVIEW_URL: "https://rebloom.cloud"
  TZ: "Asia/Seoul"
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
