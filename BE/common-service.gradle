group = 'com.ssafy.rebloom'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.13'
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.2'
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    if (!project.hasProperty('skipDefaultWebServiceDependencies')) {
        implementation project(':modules:common-module')
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-database-postgresql'
        implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
        annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
        annotationProcessor "jakarta.annotation:jakarta.annotation-api"
        annotationProcessor "jakarta.persistence:jakarta.persistence-api"
        runtimeOnly 'org.postgresql:postgresql'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

plugins.withId('org.springframework.boot') {
    tasks.named('bootRun') {
        def envFile = file('.env.local')

        if (envFile.exists()) {
            envFile.eachLine('UTF-8') { line ->
                def trimmed = line.trim()

                if (!trimmed || trimmed.startsWith('#')) {
                    return
                }

                def separatorIndex = trimmed.indexOf('=')

                if (separatorIndex <= 0) {
                    return
                }

                def key = trimmed.substring(0, separatorIndex).trim()
                def value = trimmed.substring(separatorIndex + 1).trim()

                if ((value.startsWith('"') && value.endsWith('"'))
                    || (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }

                environment key, value
            }
        }
    }
}
