plugins {
    id 'java'
}

group = 'com.ssafy.rebloom'
version = '0.0.1-SNAPSHOT'

ext {
    set('springCloudVersion', '2025.0.2')
}

allprojects {
    repositories {
        mavenCentral()
    }

    def safeProjectPath = project.path == ':' ? 'root' : project.path.replace(':', '/')
    layout.buildDirectory.set(file("${System.properties['java.io.tmpdir']}/rebloom-gradle/${safeProjectPath}"))
}

subprojects {
    group = rootProject.group
    version = rootProject.version

    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        dependencies {
            compileOnly 'org.projectlombok:lombok'
            annotationProcessor 'org.projectlombok:lombok'
            testCompileOnly 'org.projectlombok:lombok'
            testAnnotationProcessor 'org.projectlombok:lombok'
        }

        tasks.named('test') {
            useJUnitPlatform()
        }
    }

    plugins.withId('org.springframework.boot') {
        dependencies {
            implementation 'org.springframework.boot:spring-boot-starter-actuator'
            implementation 'org.springframework.boot:spring-boot-starter-validation'
            developmentOnly 'org.springframework.boot:spring-boot-devtools'
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }

    plugins.withId('io.spring.dependency-management') {
        dependencyManagement {
            imports {
                mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            }
        }
    }
}
