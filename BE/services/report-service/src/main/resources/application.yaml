spring:
  application:
    name: report-service
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:rebloom_report}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

server:
  port: ${SERVER_PORT:8084}

rebloom:
  client:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    biometric-service-url: ${BIOMETRIC_SERVICE_URL:http://localhost:8083}
    bio-ml-service-url: ${BIO_ML_SERVICE_URL:http://localhost:8002}
  security:
    permit-all: /api/v1/analyses/conversations

  kafka:
    producer-name: report-service
    topics:
      parent-report-created: ${KAFKA_TOPIC_PARENT_REPORT_CREATED:rebloom.parent-report.created.v1}
      parent-report-comment-created: ${KAFKA_TOPIC_PARENT_REPORT_COMMENT_CREATED:rebloom.parent-report-comment.created.v1}
      status-card-created: ${KAFKA_TOPIC_STATUS_CARD_CREATED:rebloom.status-card.created.v1}
      event-dlt: ${KAFKA_TOPIC_EVENT_DLT:rebloom.event.dlt.v1}
    producer:
      retries: 3
      retry-backoff-ms: 300
      request-timeout-ms: 5000
      delivery-timeout-ms: 15000
      compression-type: snappy
    consumer:
      group-id: report-service
      retry-interval-ms: 1000
      retry-max-attempts: 3
