spring:
  application:
    name: auth-service
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:rebloom_auth}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
oauth2:
  success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:5174/oauth/callback}
  allowed-success-redirect-origins: ${OAUTH2_ALLOWED_SUCCESS_REDIRECT_ORIGINS:http://localhost:5174,http://10.0.2.2:5174}
  gateway-prefix: ${OAUTH2_GATEWAY_PREFIX:/auth}

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret-key: ${JWT_SECRET}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_TIME}
  refresh-token:
    expiration: ${JWT_REFRESH_TOKEN_TIME}

rebloom:
  security:
    permit-all:
      - "/api/v1/auth/login"
      - "/api/v1/auth/reissue"
      - "/api/v1/auth/passwords/resets"
      - "/api/v1/auth/emails/**"
      - "/api/v1/auth/*/callback"
      - "/oauth2/**"
      - "/login/oauth2/code/**"
      - "/api/v1/users"
      - "/api/v1/users/profiles"
      - "/api/v1/internal/children/*/target-location"
      - "/api/v1/internal/users/*/age"
      - "/api/v1/internal/devices/serial/*/children-id"
      - "/api/v1/internal/children/*/iot-info"
      - "/api/v1/internal/children/*/parent-receiver"
      - "/api/v1/internal/children/*/counselor-receiver"
      - "/api/v1/internal/children/active"
      - "/api/v1/internal/notifications/conversation-attempt-result"
