spring:
  application:
    name: auth-service
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:rebloom_auth}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret-key: ${JWT_SECRET}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_TIME}
  refresh-token:
    expiration: ${JWT_REFRESH_TOKEN_TIME}

rebloom:
  security:
    permit-all:
      - "/api/v1/auth/login"
      - "/api/v1/auth/reissue"
      - "/api/v1/auth/passwords/resets"
      - "/api/v1/auth/emails/**"
      - "/api/v1/auth/*/callback"
      - "/api/v1/users"
      - "/api/v1/users/profiles"
      - "/api/v1/internal/children/*/target-location"
      - "/api/v1/internal/devices/serial/*/children-id"
