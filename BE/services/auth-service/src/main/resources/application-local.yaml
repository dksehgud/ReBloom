spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rebloom}?sslmode=disable&currentSchema=auth_schema
    username: ${DB_USERNAME:rebloom}
    password: ${DB_PASSWORD:rebloom}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: auth_schema

  flyway:
    schemas: auth_schema
    create-schemas: true
    baseline-on-migrate: true

jwt:
  secret-key: ${JWT_SECRET:local_secret_key_32_characters_long_minimum}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_TIME:60480000}
  refresh-token:
    expiration: ${JWT_REFRESH_TOKEN_TIME:60480000}

logging:
  level:
    root: INFO
    com.ssafy.rebloom: DEBUG
    org.hibernate.SQL: DEBUG