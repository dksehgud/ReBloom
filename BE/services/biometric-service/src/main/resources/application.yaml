spring:
  application:
    name: biometric-service
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:rebloom_biometric}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

rebloom:
  client:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  scheduler:
    daily-retraining:
      cron: ${DAILY_RETRAINING_CRON:0 0 0 * * *}
      zone: ${DAILY_RETRAINING_ZONE:Asia/Seoul}
  kafka:
    producer-name: biometric-service
    topics:
      biometric-received: ${KAFKA_TOPIC_BIOMETRIC_RECEIVED:rebloom.biometric.received.v1}
      sleep-received: ${KAFKA_TOPIC_SLEEP_RECEIVED:rebloom.sleep.received.v1}
      anomaly-analysed: ${KAFKA_TOPIC_ANOMALY_ANALYSED:rebloom.anomaly.analysed.v1}
      model-training-requested: ${KAFKA_TOPIC_MODEL_TRAINING_REQUESTED:rebloom.model.training.requested.v1}
      model-retraining-requested: ${KAFKA_TOPIC_MODEL_RETRAINING_REQUESTED:rebloom.model.retraining.requested.v1}
      phq-completed: ${KAFKA_TOPIC_PHQ_COMPLETED:rebloom.phq.completed.v1}
      event-dlt: ${KAFKA_TOPIC_EVENT_DLT:rebloom.event.dlt.v1}
    producer:
      retries: 3
      retry-backoff-ms: 300
      request-timeout-ms: 5000
      delivery-timeout-ms: 15000
      compression-type: snappy
    consumer:
      group-id: biometric-service
      retry-interval-ms: 1000
      retry-max-attempts: 3
