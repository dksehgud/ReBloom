plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy.rebloom'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.2")
}
ext.skipDefaultWebServiceDependencies = true
apply from: file('../../common-service.gradle')

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// security module
	implementation project(':modules:security-module')
	// event module
	implementation project(':modules:event-module')
	// common module
	implementation(project(':modules:common-module')){
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-data-jpa'
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-data-jpa'
		exclude group: 'com.querydsl', module: 'querydsl-jpa'
		exclude group: 'com.querydsl', module: 'querydsl-apt'
		exclude group: 'jakarta.annotation', module: 'jakarta.annotation-api'
		exclude group: 'jakarta.persistence', module: 'jakarta.persistence-api'
	}

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
