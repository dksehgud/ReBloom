spring:
  application:
    name: notification-service
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:rebloom_notification}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8085}


rebloom:
  kafka:
    producer-name: notification-service
    topics:
      anomaly-analysed: ${KAFKA_TOPIC_ANOMALY_ANALYSED:rebloom.anomaly.analysed.v1}
      conversation-initiated: ${KAFKA_TOPIC_CONVERSATION_INITIATED:rebloom.conversation.initiated.v1}
      event-dlt: ${KAFKA_TOPIC_EVENT_DLT:rebloom.event.dlt.v1}
    producer:
      retries: 3
      retry-backoff-ms: 300
      request-timeout-ms: 5000
      delivery-timeout-ms: 15000
      compression-type: snappy
    consumer:
      group-id: notification-service
      retry-interval-ms: 1000
      retry-max-attempts: 3