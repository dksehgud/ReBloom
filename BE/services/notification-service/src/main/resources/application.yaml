spring:
  application:
    name: notification-service
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:rebloom_notification}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

server:
  port: ${SERVER_PORT:8085}


rebloom:
  clients:
    auth-service:
      url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  security:
    permit-all:
      - "/api/v1/internal/notifications/conversation-attempt-result"

  kafka:
    producer-name: notification-service
    topics:
      anomaly-analysed: ${KAFKA_TOPIC_ANOMALY_ANALYSED:rebloom.anomaly.analysed.v1}
      parent-report-created: ${KAFKA_TOPIC_PARENT_REPORT_CREATED:rebloom.parent-report.created.v1}
      parent-report-comment-created: ${KAFKA_TOPIC_PARENT_REPORT_COMMENT_CREATED:rebloom.parent-report-comment.created.v1}
      event-dlt: ${KAFKA_TOPIC_EVENT_DLT:rebloom.event.dlt.v1}
    producer:
      retries: 3
      retry-backoff-ms: 300
      request-timeout-ms: 5000
      delivery-timeout-ms: 15000
      compression-type: snappy
    consumer:
      group-id: notification-service
      retry-interval-ms: 1000
      retry-max-attempts: 3

  mqtt:
    broker-uri: ${MQTT_BROKER_URI}
    client-id-prefix: ${MQTT_CLIENT_ID_PREFIX:notification-service}
    qos: ${MQTT_QOS:1}
    conversation-start-topic-template: ${MQTT_CONVERSATION_START_TOPIC_TEMPLATE:devices/%s/conversation/start}

  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase/firebase-service-account.json}
    dry-run: ${FCM_DRY_RUN:false}