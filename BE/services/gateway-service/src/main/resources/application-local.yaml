debug: true

logging:
  level:
    root: DEBUG

spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5174"
              - "http://localhost:3000"
              - "http://10.0.2.2:5174"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  secret: ${JWT_SECRET:bG9jYWwtcmVibG9vbS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy0xMjM0NTY=}
