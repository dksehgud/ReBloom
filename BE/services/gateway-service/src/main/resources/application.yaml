# ==========================================
# 공용 필터 묶음
# ==========================================
gateway-filter-sets:
  public-filters: &public-filters
    - StripPrefix=1

  secured-filters: &secured-filters
    - StripPrefix=1
    - JwtAuthenticationFilter

spring:
  application:
    name: gateway-service
  jackson:
    time-zone: Asia/Seoul
  cloud:
    gateway:
      # ==========================================
      # Global CORS 설정
      # ==========================================
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_URL:http://localhost:5174}"
              - "${FRONTEND_REDIRECT_URL:http://localhost:3000}"
              - "${FRONTEND_WEBVIEW_URL:http://10.0.2.2:5174}"
              # TODO: 배포 주소 추가
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: auth-service-oauth
          order: -3
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/auth/oauth2/**,/auth/login/oauth2/code/**
          filters:
            - StripPrefix=1
            - PreserveHostHeader

        # ==========================================
        # AUTH SERVICE - Public
        # 인증 불필요
        # ==========================================
        - id: auth-service-public
          order: -2
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            # 로그인, 토큰 재발급, 이메일 관련 API, OAuth 로그인/가입, 비밀번호 재발급
            - Path=/auth/api/v1/auth/login,/auth/api/v1/auth/passwords/resets,/auth/api/v1/auth/reissue,/auth/api/v1/auth/emails/**,/auth/api/v1/users/profiles,/auth/api/v1/auth/*/callback
          filters: *public-filters

        # 회원가입: POST /auth/api/v1/users - 인증 불필요
        - id: auth-service-signup
          order: -1
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/auth/api/v1/users
            - Method=POST
          filters: *public-filters

        # ==========================================
        # AUTH SERVICE - Secured
        # 인증 필요
        # 로그아웃, 회원탈퇴 등 나머지 /auth/** 요청
        # ==========================================
        - id: auth-service-secured
          order: 0
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/auth/**
          filters: *secured-filters

        # ==========================================
        # INTAKE SERVICE - Secured
        # 생체 raw 이벤트 수집
        # ==========================================
        - id: intake-service
          uri: ${INTAKE_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/intake/**
          filters: *secured-filters

        # ==========================================
        # REPORT SERVICE - Public IoT conversation analysis
        # ==========================================
        - id: report-service-conversation-public
          order: -1
          uri: ${REPORT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/report/api/v1/analyses/conversations
            - Method=POST
          filters: *public-filters

        # ==========================================
        # BIOMETRIC SERVICE - Secured
        # ==========================================
        - id: biometric-service
          uri: ${BIOMETRIC_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/biometric/**
          filters: *secured-filters

        # ==========================================
        # BIO ML SERVICE - Secured
        # ==========================================
        - id: bio-ml-service
          uri: ${BIO_ML_SERVICE_URI:http://localhost:8002}
          predicates:
            - Path=/ai/**
          filters: *secured-filters

        # ==========================================
        # REPORT SERVICE - Secured
        # ==========================================
        - id: report-service
          uri: ${REPORT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/report/**
          filters: *secured-filters

        # ==========================================
        # NOTIFICATION SERVICE - Public AIoT callback
        # 인증 불필요
        # ==========================================
        - id: notification-service-conversation-attempt-result-public
          order: -1
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/notification/api/v1/internal/notifications/conversation-attempt-result
            - Method=POST
          filters: *public-filters

        # ==========================================
        # NOTIFICATION SERVICE - Secured
        # ==========================================
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/notification/**
          filters: *secured-filters
          metadata:
            response-timeout: 1860000

jwt:
  secret: ${JWT_SECRET}

server:
  port: ${SERVER_PORT:8080}
